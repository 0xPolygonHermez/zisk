# Definition of the arith_eq precompile — read by `cargo-zisk-dev gen-ops`.
# Multi-op: several ZiskOps share the ArithEq op_type + one AIR/SM.
[precompile]
name        = "ArithEq"
op_type     = "ArithEq"
op_type_id  = 0x1004
op_type_id_const = "ARITH_EQ_OP_TYPE_ID"
sm_crate    = "zisk_precomp_arith_eq"
air_ids     = "ARITH_EQ_AIR_IDS"
rank_assign = false

[[precompile.op]]
name = "Arith256"
str = "arith256"
opcode = 0xF2
cost = "ARITH_EQ_COST"
input_size = 136
output_size = 64
stats = true

[[precompile.op]]
name = "Arith256Mod"
str = "arith256_mod"
opcode = 0xF3
cost = "ARITH_EQ_COST"
input_size = 168
output_size = 32
stats = true

