[package]
name = "zisk-precomp-keccakf"
description = "Keccak-f permutation precompile for the ZisK zkVM"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }
build = "build.rs"

[dependencies]
zisk-core = { workspace = true }
zisk-common = { workspace = true }
zisk-pil = { workspace = true }

proofman-common = { workspace = true }
proofman-util = { workspace = true }

zisk-precomp-common = { workspace = true }
zisk-precomp-helpers = { workspace = true }

pil2-std-lib = { workspace = true }

proofman-fields = { workspace = true }
tracing = { workspace = true }
rayon = { workspace = true }

tiny-keccak = { workspace = true, features = ["keccak"] }

[features]
default = []
cpu-only = []

[dev-dependencies]
zisk-test-artifacts = { workspace = true }

[lints.rust]
# `gpu` is set by build.rs only when CUDA is detected.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gpu)'] }
