[package]
name = "zisk-precomp-keccakf"
description = "Keccak-f permutation precompile for the ZisK zkVM"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }
build = "build.rs"

[dependencies]
zisk-core = { workspace = true }
zisk-common = { workspace = true }
zisk-pil = { workspace = true }
zisk-sm-binary = { workspace = true }

proofman-common = { workspace = true }
proofman-util = { workspace = true }

zisk-precomp-common = { workspace = true }
zisk-precomp-helpers = { workspace = true }

pil2-std-lib = { workspace = true }

proofman-fields = { workspace = true }
tracing = { workspace = true }
rayon = { workspace = true }

tiny-keccak = { workspace = true, features = ["keccak"] }
zisk-gpu-witness = { workspace = true }

[features]
default = []
cpu-only = []

[dev-dependencies]
zisk-test-artifacts = { workspace = true }

[build-dependencies]
zisk-cuda-build = { workspace = true }

[lints.cargo]
# `zisk-gpu-witness` is only named under `cfg(gpu)`, which build.rs sets when CUDA is detected.
# A Cargo.toml cannot express that cfg, so on a non-GPU build the dependency looks unused.
unused_dependencies = "allow"

[lints.rust]
# `gpu` is set by build.rs only when CUDA is detected; declare it so the
# `unexpected_cfgs` lint does not flag it on non-GPU targets.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gpu)'] }
