# Definition of the arith_eq_384 precompile — read by `cargo-zisk-dev gen-ops`.
# Multi-op: several ZiskOps share the ArithEq384 op_type + one AIR/SM.
[precompile]
name        = "ArithEq384"
op_type     = "ArithEq384"
op_type_id_const = "ARITH_EQ_384_OP_TYPE_ID"
sm_crate    = "zisk_precomp_arith_eq_384"
