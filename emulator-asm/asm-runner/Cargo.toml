[package]
name = "zisk-asm-runner"
description = "Runtime for managing the ZisK assembly emulator process and its shared-memory I/O"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

build = "build.rs"

[lib]
name = "zisk_asm_runner"
path = "src/lib.rs"

[dependencies]
zisk-common = { workspace = true }
zisk-core = { workspace = true }
proofman-util = { workspace = true }
zisk-sm-mem-planner = { workspace = true }
zisk-sm-mem-common = { workspace = true }

tracing = { workspace = true }
rayon = { workspace = true }
anyhow = { workspace = true }

libc = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
named-sem = { workspace = true }

[features]
stats = []
save_mem_plans = []
cpu-only = ["zisk-sm-mem-planner/cpu-only"]

[lints.rust]
# `gpu` is set by build.rs only when CUDA is detected; declare it so the
# `unexpected_cfgs` lint does not flag it on non-GPU targets (e.g. macOS CI).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gpu)'] }
