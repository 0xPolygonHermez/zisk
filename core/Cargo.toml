[package]
name = "zisk-core"
description = "Core types and proving primitives for the ZisK zkVM"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

[lib]
name = "zisk_core"
path = "src/lib.rs"

[[bin]]
name = "riscv2zisk"
path = "src/bin/riscv2zisk.rs"

[dependencies]
precompiles-helpers = { workspace = true }
lib-c = { workspace = true }
ziskos = { workspace = true }
zisk-riscv = { workspace = true }
rayon = { workspace = true }
proofman-fields = { workspace = true }
sha2 = { workspace = true }
paste = { workspace = true }
zisk-definitions = { workspace = true }

elf = "0.7.4"
tiny-keccak = { workspace = true }

[build-dependencies]
lib-float = { workspace = true, optional = true }

[features]
default = []
debug_dma = []
log_dma_ops = []
# sp = []
float = ["dep:lib-float", "lib-float/float"]
