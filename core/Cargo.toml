[package]
name = "zisk-core"
description = "Core types and proving primitives for the ZisK zkVM"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }
# Exposes the memory size features to the build scripts of the crates that compile C, C++ or
# CUDA code with the memory map (DEP_ZISK_CORE_INPUT_2GB, DEP_ZISK_CORE_RAM_2GB)
links = "zisk_core"

[lib]
name = "zisk_core"
path = "src/lib.rs"

[dependencies]
zisk-precomp-helpers = { workspace = true }
ziskos = { workspace = true }
rayon = { workspace = true }
proofman-fields = { workspace = true }
sha2 = { workspace = true }
paste = { workspace = true }
zisk-definitions = { workspace = true }

tiny-keccak = { workspace = true, features = ["keccak"] }
elf = "0.7.4"

[build-dependencies]
zisk-lib-float = { workspace = true, optional = true }

[features]
default = []
# Memory the executors reserve for the input data and the RAM. Neither changes the address map
# nor the arithmetization, whose windows stay 2GB each (INPUT_WINDOW_SIZE, RAM_WINDOW_SIZE).
# Without them the input is limited to 1GB and the RAM to 512MB; with them, to the whole 2GB
# window. `input_2gb` also changes the BIOS, which reads the input every 128MB up to its limit,
# and so the ROM commitment of every program; the verification key does not change.
input_2gb = []
ram_2gb = []
# Cross-checks the FROPS multiplicity column the state-machine collectors build
# against an independent reference for the same execution: the ROM-histogram
# assembly's column on the ASM path, a Rust replay of the minimal traces on the
# emulated one. A development aid, off by default -- compiling it out removes its
# table, the extra replay, and the per-operation branch that feeds it. See
# `zisk_core::frops`.
debug_frops = []
debug_dma = []
log_dma_ops = []
# sp = []
float = ["dep:zisk-lib-float", "zisk-lib-float/float"]
zba = []
zbc = []
zbkc = []
zbkx = []
zba_native = []
zbc_native = []
zbkc_native = []
zbkx_native = []
zicond_native = []
