# Wrapper crate around ziskos that compiles with hints feature enabled.
#
# src/core/ is a symlink to ../../ziskos/entrypoint/src/ - same source, different features.
# src/lib.rs wraps the symlinked source and adds hints-specific modules.
# Exports C symbols with "hints_" prefix to avoid linker conflicts with ziskos.
# See README.md for details.

[package]
name = "ziskos-hints"
description = "Guest runtime and entrypoint for programs targeting the ZisK zkVM with the hints feature enabled"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }

[dependencies]
zisk-zkvm-interface = { workspace = true }
zisk-lib-c = { workspace = true }

num-bigint = { workspace = true }
num-integer = { workspace = true }
num-traits = { workspace = true }

zisk-precomp-helpers = { workspace = true }

rand = { workspace = true }

lazy_static = { workspace = true }
getrandom = { workspace = true }
cfg-if = { workspace = true }
tiny-keccak = { workspace = true }
serde = { workspace = true, features = ["derive"] }
bincode = { workspace = true }
paste = { workspace = true }
sha2 = { workspace = true }
proofman-fields = { workspace = true }
ripemd = { workspace = true }

anyhow = { workspace = true }
zisk-verifier = { workspace = true }

[features]
default = ["hints"]
hints = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(zisk_staticlib)',
  'cfg(zisk_hints)',
  'cfg(zisk_hints_metrics)',
  'cfg(zisk_hints_debug)',
  'cfg(zisk_hints_single_thread)',
] }
