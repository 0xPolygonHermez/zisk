apiVersion: 1

# Watch /etc/grafana/dashboards for *.json files and auto-load them.
# updateIntervalSeconds: 10 → drop a new JSON in the directory and Grafana
# picks it up within 10s, no restart needed.
# allowUiUpdates: true → dashboards can be tried out in the UI, but every one except
# zisk-overview.json is generated: carry a change over to
# ../../generator/zisk_dashboards.py and run it again, or the next run drops it.
providers:
  - name: zisk
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
