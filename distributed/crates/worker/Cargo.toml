[package]
name = "zisk-worker"
description = "Worker node for the ZisK distributed proving network"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }
publish = false

[[bin]]
name = "zisk-worker"
path = "src/cli/main.rs"

[build-dependencies]
vergen-git2 = { workspace = true }

[dependencies]
zisk-cluster-common = { workspace = true }
zisk-cluster-api = { workspace = true }
zisk-coordinator = { workspace = true }

zisk-common = { workspace = true }
zisk-prover-backend = { workspace = true }
proofman = { workspace = true }
proofman-common = { workspace = true }
bincode = { workspace = true }
chrono = { workspace = true }

tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
borsh = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
config = { workspace = true }
uuid = { workspace = true }

# Not used directly; pins the transitive `time` to =0.3.47 (workspace dep) to
# avoid the rcgen 0.14.x E0119 coherence bug triggered by time 0.3.48.
time = { workspace = true }

[features]
default = []
cpu-only = ["zisk-prover-backend/cpu-only"]
