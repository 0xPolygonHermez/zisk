[package]
name = "zisk-transpiler-wasm"
description = "Transpiler from WebAssembly to the ZisK instruction set"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }

[[bin]]
name = "wasm2zisk"
path = "src/bin/wasm2zisk.rs"

[dependencies]
zisk-core = { workspace = true }
zisk-definitions = { workspace = true }
zisk-riscv = { workspace = true }
ziskasm = { workspace = true }

wasmparser = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
wat = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
tiny-keccak = { workspace = true }
base64 = "0.22"
regex = { workspace = true }
toml = { workspace = true }

[features]
default = []
float = ["zisk-riscv/float", "zisk-core/float"]

[[example]]
name = "nitro_tools"
path = "examples/nitro_tools/main.rs"
