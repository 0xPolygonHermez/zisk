[package]
name = "zisk-riscv"
description = "RISC-V instruction structures and parser for the ZisK zkVM"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }

[dependencies]
zisk-definitions = { workspace = true }
zisk-core = { workspace = true }

[build-dependencies]
zisk-lib-float = { workspace = true, optional = true }

[features]
# Zba is proven natively by ZisK (sh<n>add and slli.uw in the binary state machines, add.uw
# and the .uw shift-and-adds by transpilation), so it is enabled by default like the Zbb /
# Zbs / Zbkb extensions. Use `default-features = false` (plus `zba` for the decomposed
# sequences) to opt out.
default = ["zba_native"]
float = ["dep:zisk-lib-float", "zisk-lib-float/float"]
zba = []
zbc = []
zbkc = []
zbkx = []
zba_native = []
zbc_native = []
zbkc_native = []
zbkx_native = []
zicond_native = []
