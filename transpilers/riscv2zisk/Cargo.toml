[package]
name = "zisk-transpiler-riscv"
description = "Transpiler from RISC-V to the ZisK instruction set"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }

[[bin]]
name = "zisk-transpiler-riscv"
path = "src/bin/riscv2zisk.rs"

[dependencies]
zisk-core = { workspace = true }
zisk-riscv = { workspace = true }
zisk-transpiler-wasm = { workspace = true }

[build-dependencies]
zisk-lib-float = { workspace = true, optional = true }

[features]
# Zba is proven natively by ZisK (sh<n>add and slli.uw in the binary state machines, add.uw
# and the .uw shift-and-adds by transpilation), so it is enabled by default like the Zbb /
# Zbs / Zbkb extensions. Use `default-features = false` (plus `zba` for the decomposed
# sequences) to opt out.
default = ["zba_native"]
zba = ["zisk-riscv/zba", "zisk-core/zba"]
zbc = ["zisk-riscv/zbc", "zisk-core/zbc"]
zbkc = ["zisk-riscv/zbkc", "zisk-core/zbkc"]
zbkx = ["zisk-riscv/zbkx", "zisk-core/zbkx"]
zba_native = ["zisk-riscv/zba_native", "zisk-core/zba_native"]
zbc_native = ["zisk-riscv/zbc_native", "zisk-core/zbc_native"]
zbkc_native = ["zisk-riscv/zbkc_native", "zisk-core/zbkc_native"]
zbkx_native = ["zisk-riscv/zbkx_native", "zisk-core/zbkx_native"]
zicond_native = ["zisk-riscv/zicond_native", "zisk-core/zicond_native"]
float = ["zisk-riscv/float", "zisk-transpiler-wasm/float"]
# RISC-V C (compressed) extension decoding (see zisk-riscv's `compressed`). OFF by default.
compressed = ["zisk-riscv/compressed"]
