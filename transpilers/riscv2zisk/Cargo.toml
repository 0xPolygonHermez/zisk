[package]
name = "zisk-transpiler-riscv"
description = "Transpiler from RISC-V to the ZisK instruction set"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }

[[bin]]
name = "zisk-transpiler-riscv"
path = "src/bin/riscv2zisk.rs"

[dependencies]
zisk-core = { workspace = true }
zisk-transpiler-common = { workspace = true }

[build-dependencies]
zisk-lib-float = { workspace = true, optional = true }

[features]
default = []
bit_manipulation_extensions = []
float = ["zisk-transpiler-common/float"]
