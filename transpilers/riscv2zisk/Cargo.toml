[package]
name = "riscv2zisk"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

[[bin]]
name = "riscv2zisk"
path = "src/bin/riscv2zisk.rs"

[dependencies]
zisk-definitions = { workspace = true }
zisk-core = { workspace = true }
transpilers-common = { workspace = true }

[build-dependencies]
lib-float = { workspace = true, optional = true }

[features]
default = []
zba = ["transpilers-common/zba", "zisk-core/zba"]
zbc = ["transpilers-common/zbc", "zisk-core/zbc"]
zbkc = ["transpilers-common/zbkc", "zisk-core/zbkc"]
zbkx = ["transpilers-common/zbkx", "zisk-core/zbkx"]
zba_native = ["transpilers-common/zba_native", "zisk-core/zba_native"]
zbc_native = ["transpilers-common/zbc_native", "zisk-core/zbc_native"]
zbkc_native = ["transpilers-common/zbkc_native", "zisk-core/zbkc_native"]
zbkx_native = ["transpilers-common/zbkx_native", "zisk-core/zbkx_native"]
float = ["transpilers-common/float"]