[package]
name = "zisk-transpiler-common"
description = "Shared ELF-to-ROM transpilation utilities for the ZisK zkVM"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

[dependencies]
zisk-core = { workspace = true }
zisk-riscv = { workspace = true }

elf = "0.7.4"

[build-dependencies]
zisk-lib-float = { workspace = true, optional = true }

[features]
default = []
float = ["dep:zisk-lib-float", "zisk-lib-float/float", "zisk-riscv/float", "zisk-core/float"]
bit_manipulation_extensions = ["zisk-riscv/bit_manipulation_extensions", "zisk-core/bit_manipulation_extensions"]