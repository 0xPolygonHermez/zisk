keywords = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

[dependencies]
zisk-definitions = { workspace = true }
zisk-core = { workspace = true }
zisk-riscv = { workspace = true }
elf = "0.7.4"

[build-dependencies]
lib-float = { workspace = true, optional = true }

[features]
default = []
float = ["dep:lib-float", "lib-float/float", "zisk-riscv/float", "zisk-core/float"]
bit_manipulation_extensions = ["zisk-riscv/bit_manipulation_extensions", "zisk-core/bit_manipulation_extensions"]