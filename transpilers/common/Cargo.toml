[package]
name = "transpilers-common"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

[dependencies]
zisk-definitions = { workspace = true }
zisk-core = { workspace = true }
riscv = { workspace = true }
elf = "0.7.4"

[build-dependencies]
lib-float = { workspace = true, optional = true }

[features]
default = []
float = ["dep:lib-float", "lib-float/float", "riscv/float", "zisk-core/float"]
zba = ["riscv/zba", "zisk-core/zba"]
zbc = ["riscv/zbc", "zisk-core/zbc"]
zbkc = ["riscv/zbkc", "zisk-core/zbkc"]
zbkx = ["riscv/zbkx", "zisk-core/zbkx"]
zba_native = ["riscv/zba_native", "zisk-core/zba_native"]
zbc_native = ["riscv/zbc_native", "zisk-core/zbc_native"]
zbkc_native = ["riscv/zbkc_native", "zisk-core/zbkc_native"]
zbkx_native = ["riscv/zbkx_native", "zisk-core/zbkx_native"]
zicond_native = ["riscv/zicond_native", "zisk-core/zicond_native"]