[package]
name = "zisk-transpiler"
description = "Transpiles ZisK zkVM guest programs (RISC-V ELF, WebAssembly) into ZisK ROMs"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }

[[bin]]
name = "zisk-transpiler-riscv"
path = "src/bin/zisk-transpiler-riscv.rs"

[dependencies]
zisk-core = { workspace = true }
zisk-transpiler-riscv = { workspace = true }
zisk-transpiler-wasm = { workspace = true }

[build-dependencies]
zisk-lib-float = { workspace = true, optional = true }

[features]
# Zba is proven natively by ZisK (sh<n>add and slli.uw in the binary state machines, add.uw
# and the .uw shift-and-adds by transpilation), so it is enabled by default like the Zbb /
# Zbs / Zbkb extensions. Use `default-features = false` (plus `zba` for the decomposed
# sequences) to opt out.
default = ["zba_native"]
float = [
    "dep:zisk-lib-float",
    "zisk-lib-float/float",
    "zisk-transpiler-riscv/float",
    "zisk-core/float",
    "zisk-transpiler-wasm/float",
]
# RISC-V C (compressed) extension decoding (see zisk-transpiler-riscv's `compressed`).
# OFF by default.
compressed = ["zisk-transpiler-riscv/compressed"]
zba = ["zisk-transpiler-riscv/zba", "zisk-core/zba"]
zbc = ["zisk-transpiler-riscv/zbc", "zisk-core/zbc"]
zbkc = ["zisk-transpiler-riscv/zbkc", "zisk-core/zbkc"]
zbkx = ["zisk-transpiler-riscv/zbkx", "zisk-core/zbkx"]
zba_native = ["zisk-transpiler-riscv/zba_native", "zisk-core/zba_native"]
zbc_native = ["zisk-transpiler-riscv/zbc_native", "zisk-core/zbc_native"]
zbkc_native = ["zisk-transpiler-riscv/zbkc_native", "zisk-core/zbkc_native"]
zbkx_native = ["zisk-transpiler-riscv/zbkx_native", "zisk-core/zbkx_native"]
zicond_native = ["zisk-transpiler-riscv/zicond_native", "zisk-core/zicond_native"]
