# Typechecks the two generated Lean trees under sail/build/, and the proofs
# written against them.
#
# The generated trees are build artifacts, so this package holds sources only
# for `Proofs`; the other two libraries point at the directory each generator
# writes.
#
#   Out    — the ISA model, from `make lean` (sail --lean)
#   Pil    — the AIR constraints, from `make pil` (pilout-constraints)
#   Proofs — hand-written, in Proofs/
name = "zisk"
defaultTargets = ["Out", "Pil", "Proofs"]

[[lean_lib]]
name = "Pil"
srcDir = "../build/pil"

[[lean_lib]]
name = "Out"
srcDir = "../build/lean/out"
# Sail's own generated lakefile sets this; the model's terms need the stack.
moreLeanArgs = ["--tstack=400000"]

[[lean_lib]]
name = "Proofs"
srcDir = "."
# The op-bus exclusions `decide` over thousands of subset sums (OpBus.lean),
# which needs the same stack as the model.
moreLeanArgs = ["--tstack=400000"]
