[package]
name = "secp256k1_ab"
version.workspace = true
edition.workspace = true

[dependencies]
ziskos.workspace = true
# The ziskasm zisklib bindings (zkvmcall thunks to the hand-written .zisk
# routines). Only linked for the `ziskasm` backend build.
zisklib = { path = "../../../ziskasm/lang/rust", optional = true }

[features]
# Run the in-scope tests against the ziskasm zisklib (through its zkvmcall
# bindings) instead of the in-guest Rust zisklib. The test bodies are unchanged;
# a per-module glue fn adapts the flat ABI to the rich Rust signature.
ziskasm = ["dep:zisklib"]
