[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace]
members = [
  "bigint",
  "modexp_ab",
  "keccak_ab",
  "secp256k1_ab",
  "secp256r1_ab",
  "bn254_ab",
  "bls_ab",
  "bls12_381",
  "bn254",
  "examples/*",
  "diagnostic",
  "diagnostic_hints",
  "ed25519_verify",
  "hashes",
  "secp256k1",
  "secp256r1",
  "syscalls/*",
  "uint256",
  "unaligned_out",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[workspace.dependencies]
ziskos = { path = "../../ziskos/entrypoint" }
zisk-zkvm-interface = { path = "../../zkvm-interface" }
zisk-precomp-helpers = { path = "../../precompiles/helpers" }

rand = "0.8.1"
ed25519-dalek = "2.1"
curve25519-dalek = "4.1"
sha2 = "0.10"
ruint = { version = "1", default-features = false }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_vendor, values("zisk"))',
] }
