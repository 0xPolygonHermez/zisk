[package]
name = "ziskemu"
description = "RISC-V emulator that executes ZisK program ROMs and generates execution traces"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }

[lib]
name = "ziskemu"
path = "src/lib.rs"

[[bin]]
name = "ziskemu"
path = "src/bin/ziskemu.rs"

[dependencies]
zisk-common = { workspace = true }
zisk-core = { workspace = true }
zisk-pil = { workspace = true }
zisk-riscv = { workspace = true }
zisk-transpiler-riscv = { workspace = true }
rayon = { workspace = true }
zisk-sm-mem-common = { workspace = true }
zisk-sm-arith = { workspace = true }
zisk-sm-binary = { workspace = true }
zisk-definitions = { workspace = true }

proofman-fields = { workspace = true }
clap = { workspace = true }
sysinfo = { workspace = true }
serde_json = { workspace = true }
flate2 = "1.0"
object = "0.37.3"
memmap2 = "0.9.8"
num-format = "0.4"
symbolic-demangle = { version = "12.16", features = ["rust", "cpp"] }
regex = { workspace = true }

# Not used directly; pins the transitive `time` to =0.3.47 (workspace dep) to
# avoid the rcgen 0.14.x E0119 coherence bug triggered by time 0.3.48.
time = { workspace = true }

[build-dependencies]
vergen-git2 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "benchmark"
harness = false

[features]
default = []
debug_stats_trace = []
minimal_trace_index_debug = []
handle_stdout = []
debug_call_stack = []
# sp = []
