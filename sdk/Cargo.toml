[package]
name = "zisk-sdk"
description = "High-level client SDK for proving and verifying programs on the ZisK zkVM"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }

[dependencies]
# Zisk prover backend (contains prover and guest types)
zisk-prover-backend = { workspace = true }

# Common dependencies
proofman-common = { workspace = true }
zisk-common = { workspace = true }
zisk-build = { workspace = true }

# Utilities
thiserror = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
zisk-coordinator-api = { workspace = true }
zisk-coordinator-client = { workspace = true }

# For utils.rs
zisk-rom-setup = { workspace = true }

# Recurser-aggregator support
zisk-recurser = { workspace = true }
proofman = { workspace = true }
proofman-verifier = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
proofman-fields = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
zisk-test-artifacts = { workspace = true }

[features]
default = []
cpu-only = ["zisk-prover-backend/cpu-only"]
stats = ["zisk-prover-backend/stats"]
diagnostic = ["zisk-prover-backend/diagnostic"]
