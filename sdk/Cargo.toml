[package]
name = "zisk-sdk"
description = "High-level client SDK for proving and verifying programs on the ZisK zkVM"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }

[dependencies]
# Zisk prover backend (contains prover and guest types)
zisk-prover-backend = { workspace = true }

# Common dependencies
proofman-common = { workspace = true }
zisk-common = { workspace = true }
zisk-build = { workspace = true }

# Utilities
thiserror = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
zisk-coordinator-api = { workspace = true }
zisk-coordinator-client = { workspace = true }

# For utils.rs
zisk-rom-setup = { workspace = true }

# Recurser-aggregator support
zisk-recurser = { workspace = true }
proofman = { workspace = true }
proofman-verifier = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
proofman-fields = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
zisk-test-artifacts = { workspace = true }

[features]
default = []
# Cross-checks the FROPS multiplicity column the state-machine collectors build
# against an independent reference for the same execution: the ROM-histogram
# assembly's column on the ASM path, a Rust replay of the minimal traces on the
# emulated one. A development aid, off by default -- compiling it out removes its
# table, the extra replay, and the per-operation branch that feeds it. See
# `zisk_core::frops`.
debug_frops = ["zisk-prover-backend/debug_frops"]
cpu-only = ["zisk-prover-backend/cpu-only"]
stats = ["zisk-prover-backend/stats"]
witness_timers = ["zisk-prover-backend/witness_timers"]
diagnostic = ["zisk-prover-backend/diagnostic"]
