[package]
name = "zisk-sm-arith"
description = "Arithmetic state machine for the ZisK zkVM"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }

[[bin]]
name = "zisk-arith-frops-fixed-gen"
path = "src/arith_frops_fixed_gen.rs"

[[bin]]
name = "arith_carry_range"
path = "src/tools/arith_carry_range.rs"

[[bin]]
name = "arith_table_decode_gen"
path = "src/tools/arith_table_decode_gen.rs"

[dependencies]
zisk-core = { workspace = true }
zisk-common = { workspace = true }
zisk-pil = { workspace = true }
zisk-sm-binary = { workspace = true }
zisk-sm-frequent-ops = { workspace = true }

proofman-fields = { workspace = true }
proofman-common = { workspace = true }
pil2-std-lib = { workspace = true }

tracing = { workspace = true }
rayon = { workspace = true }

[features]
default = []
# Cross-checks the FROPS multiplicity column the state-machine collectors build
# against an independent reference for the same execution: the ROM-histogram
# assembly's column on the ASM path, a Rust replay of the minimal traces on the
# emulated one. A development aid, off by default -- compiling it out removes its
# table, the extra replay, and the per-operation branch that feeds it. See
# `zisk_core::frops`.
debug_frops = ["zisk-core/debug_frops"]
generate_code_arith_range_table = []
