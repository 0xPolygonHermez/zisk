[package]
name = "zisk-definitions-sync"
description = "Build-time step that syncs zisk-definitions' committed generated files (Rust/C/PIL/asm) with its #[constants] definitions"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }

# Dev-only build trigger; never published (its build.rs writes into the source tree).
publish = false

[build-dependencies]
# Compiled before this crate's build.rs runs, so build.rs can read the evaluated
# ZISK_CONSTANTS (the phase wall: a crate's own build.rs can't read its own lib).
zisk-definitions-source = { workspace = true }
zisk-definitions-generator = { workspace = true }
