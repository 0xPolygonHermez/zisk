[package]
name = "zisk-definitions"
description = "Shared low-level definitions (syscalls, hints, labels) for the ZisK zkVM"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }
# The generated C/PIL/asm are repo build inputs for the emulator and the constraints,
# not part of the Rust API; only the generated Rust ships.
exclude = ["src/generated/c", "src/generated/pil", "src/generated/asm"]

[lib]
name = "zisk_definitions"
path = "src/lib.rs"

[features]
default = []
stats = []
