[package]
name = "zisk-solana-verifier"
version = "0.1.0"
edition = "2021"

[features]
trace = []
profile-cus = ["dep:solana-program"]

[dependencies]
solana-program = { version = "=2.3.0", optional = true }
ark-bn254 = { version = "=0.4.0", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "=0.4.2", default-features = false }
solana-bn254 = "=2.2.2"
solana-keccak-hasher = "=2.2.1"
solana-sha256-hasher = "=2.3.0"

[dev-dependencies]
serde_json = "=1.0.145"
hex = "=0.4.3"
ark-bn254 = { version = "=0.4.0", features = ["curve"] }
