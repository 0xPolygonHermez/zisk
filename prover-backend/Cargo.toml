[package]
name = "zisk-prover-backend"
description = "Proving backend for the ZisK zkVM"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }

[dependencies]
# Proofman dependencies
proofman = { workspace = true }
proofman-common = { workspace = true }
proofman-util = { workspace = true }
proofman-verifier = { workspace = true, features = ["parallel"] }

# Zisk internal crates
zisk-program-macros = { workspace = true }
zisk-common = { workspace = true }
zisk-core = { workspace = true }
zisk-pil = { workspace = true }
zisk-cluster-common = { workspace = true }
zisk-transpiler-riscv = { workspace = true }
zisk-executor = { workspace = true }
zisk-rom-setup = { workspace = true }
zisk-asm-runner = { workspace = true }
zisk-precomp-hints = { workspace = true }
proofman-fields = { workspace = true }
zisk-recurser = { workspace = true }
borsh = { workspace = true }

# Optional dependencies
ziskemu = { workspace = true }

# External dependencies
anyhow = { workspace = true }
colored = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
blake3 = { workspace = true }
alloy-sol-types = { workspace = true }

[features]
default = []
# Cross-checks the FROPS multiplicity column the state-machine collectors build
# against an independent reference for the same execution: the ROM-histogram
# assembly's column on the ASM path, a Rust replay of the minimal traces on the
# emulated one. A development aid, off by default -- compiling it out removes its
# table, the extra replay, and the per-operation branch that feeds it. See
# `zisk_core::frops`.
debug_frops = ["zisk-executor/debug_frops"]
witness_timers = ["zisk-executor/witness_timers"]
cpu-only = ["proofman-common/cpu-only", "zisk-executor/cpu-only"]
stats = []
diagnostic = ["proofman/diagnostic"]
