name: Test ZisK

on:
  pull_request:
    branches:
      - develop
      - main
      - "pre-develop-[0-9]+.[0-9]+.[0-9]*"
    paths-ignore:
      - 'book/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-tests:
    name: Cargo tests
    runs-on: rocket
    container:
      image: ubuntu:22.04
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./install_deps.sh

      - name: Add Cargo to PATH
        # install_deps.sh already installs Rust via rustup into ~/.cargo/bin;
        # just expose it to subsequent steps.
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          rustc --version
          cargo --version

      - name: Build cargo-zisk
        run: cargo build --bin cargo-zisk

      - name: Install ZisK rust toolchain
        run: ./target/debug/cargo-zisk toolchain install

      - name: Run cargo check
        run: cargo check --all-targets

      - name: Run cargo test
        run: cargo test --workspace --release
        env:
          RUSTFLAGS: -Copt-level=3 -Cdebug-assertions -Coverflow-checks=y -Cdebuginfo=0 -C target-cpu=native
          RUST_BACKTRACE: 1

  zisk-contracts:
    name: Hardhat tests (zisk-contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          sudo ./install_deps.sh

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build cargo-zisk-dev
        run: cargo build --release -p cargo-zisk --bin cargo-zisk-dev

      - name: Generate Solidity calldata fixture
        working-directory: zisk-contracts
        run: ../target/release/cargo-zisk-dev export-solidity-calldata -p test/plonk_proof.bin -o fixtures/fixture.json

      - name: Install JS dependencies
        working-directory: zisk-contracts
        run: npm install --no-audit --no-fund

      - name: Run Hardhat test
        working-directory: zisk-contracts
        env:
          ZISK_SOLIDITY_FIXTURE: fixtures/fixture.json
        run: npx hardhat test

  build-riscv64im:
    name: Build ziskos-staticlib (riscv64im-unknown-none-elf)
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust nightly with rust-src
        # riscv64im-unknown-none-elf is a Tier 3 target — no pre-built std is available.
        # rust-src is required so that -Z build-std can compile core/alloc from source.
        # No cross-compiler is needed; Rust uses its bundled rust-lld linker.
        run: rustup toolchain install nightly --component rust-src --no-self-update

      - name: Build ziskos-staticlib for riscv64im-unknown-none-elf
        run: cargo +nightly build -p ziskos-staticlib --release --target riscv64im-unknown-none-elf -Z build-std=core,alloc --config 'profile.release.lto="fat"' --features panic-handler
        env:
          RUSTFLAGS: "-D warnings"

  test-x86_64:
    name: Test on Ubuntu x86_64
    runs-on:
      group: zisk-gpu
    timeout-minutes: 180
    # NOTE: We intentionally use 'docker exec' in individual steps rather than
    # defining a job-level container. The test scripts deploy systemd services
    # (zisk-coordinator, zisk-worker) inside the container, which requires
    # systemd as PID 1 and a fully privileged environment. GitHub Actions
    # job-level containers do not support this setup.
    defaults:
      run:
        shell: bash
    env:
      TEST_CONTAINER: zisk-gha-test
      # zisk-eth-client guest under test: ziskethone or reth.
      ZEC_GUEST: ziskethone

    steps:
      - name: Fix workspace permissions
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE" || true

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Give workspace ownership to container user
        run: |
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE"

      - name: Prepare cache-setup directory
        run: |
          sudo mkdir -p /home/gha/cache-setup
          sudo chown -R 1000:1000 /home/gha/cache-setup
          sudo chmod -R u+rwX /home/gha/cache-setup

      - name: Start test container with systemd
        run: .github/scripts/start_test_container.sh

      - name: Build ZisK
        run: |
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./build_zisk.sh
            '

      - name: Build libziskos.a with an isolated allocator and check required symbols
        run: |
          docker cp .github/scripts/build-libziskos-isolated.sh "${TEST_CONTAINER}:/home/ziskuser/build-libziskos-isolated.sh"
          docker exec "${TEST_CONTAINER}" chmod +x /home/ziskuser/build-libziskos-isolated.sh
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -- bash -lc '
              cd /workspace/zisk
              /home/ziskuser/build-libziskos-isolated.sh
            '

      - name: Build setup
        run: |
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -e USE_CACHE_SETUP="1" \
            -e INSTALL_SETUP="1" \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./build_setup.sh
            '

      - name: Test sha_hasher (CPU)
        run: |
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -e ONLY_CPU="1" \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./test_sha_hasher.sh
            '

      - name: Test sha_hasher (GPU)
        run: |
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./test_sha_hasher.sh
            '

      - name: Test ELF diagnostic
        run: |
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./test_diagnostic.sh
            '

      # The ziskethone ELF is committed in zisk-eth-client and consumed as-is
      # (REBUILD_ZISKETHONE_GUEST=1 rebuilds it, which needs a cmake the published
      # test image does not have).
      - name: Build zec guest ELF file
        run: |
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -e ZEC_GUEST="${ZEC_GUEST}" \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./build_zec_guest.sh
            '

      # Input names carry a _zec_<guest> suffix, which the scripts retarget at
      # ZEC_GUEST.
      - name: Prove Ethereum block
        run: |
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -e ZEC_GUEST="${ZEC_GUEST}" \
            -e BLOCK_INPUTS_SINGLE="mainnet_25431013_172_16_zec_ziskethone.bin,mainnet_25431039_325_25_zec_ziskethone.bin" \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./test_eth_block.sh
            '

      - name: Ethproofs test (no hints)
        run: |
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -e ZEC_GUEST="${ZEC_GUEST}" \
            -e BLOCK_INPUTS_ETHPROOFS="mainnet_25431013_172_16_zec_ziskethone.bin,mainnet_25431039_325_25_zec_ziskethone.bin" \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./test_ethproofs.sh
            '

      # reth only: ENABLE_HINTS is pinned to 0 for ziskethone, which emits no
      # hints, so this would just repeat the step above.
      - name: Ethproofs test (hints)
        if: env.ZEC_GUEST == 'reth'
        run: |
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -e ZEC_GUEST="${ZEC_GUEST}" \
            -e ENABLE_HINTS="1" \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./test_ethproofs.sh
            '

      - name: Stop test container
        if: always()
        run: |
          docker rm -f "${TEST_CONTAINER}" || true
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE" || true

  test-macos:
    name: Test on macOS
    runs-on: macos-14
    # Includes the ziskethone cross-toolchain build (~10-15 min on a cold runner).
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      ZISK_GHA: "1"
      ZISK_REPO_DIR: ${{ github.workspace }}
      TERM: xterm
    steps:
      - name: Check Rust version
        run: rustc --version

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./install_deps.sh

      - name: Build ZisK
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./build_zisk.sh

      # Rebuilt rather than taken from the committed ELF: cross-compiling the
      # ziskethone guest is what this job is here to cover on macOS. Costs a
      # ~10-15 min toolchain install on a cold runner.
      - name: Build zec guest ELF file
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          REBUILD_ZISKETHONE_GUEST=1 ./build_zec_guest.sh

      - name: Test sha_hasher
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./test_sha_hasher.sh

  lint:
    name: Format & Clippy on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: Ubuntu x86_64
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: macOS
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: rustfmt, clippy

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./install_deps.sh

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check
        env:
          CARGO_INCREMENTAL: 1

      - name: Build cargo-zisk
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --bin cargo-zisk

      - name: Install ZisK rust toolchain
        run: ./target/debug/cargo-zisk toolchain install

      - name: Run cargo clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          # args: --all-targets -- -D warnings
          args: --all-features --all-targets -- -D warnings -A incomplete-features
        env:
          CARGO_INCREMENTAL: 1

  crates-to-publish:
    name: Crates to publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Check ZisK crates to publish
        run: tools/crates.io/check_crates_to_publish.sh --zisk-repo-path "$GITHUB_WORKSPACE"

      - name: Clone the pil2-proofman commit the dependencies point at
        id: proofman
        # PROOFMAN_CRATES is checked against the very commit that is built into
        # ZisK. Cargo.lock records it for the `proofman` package as
        # git+<url>?branch=<branch>#<commit>, the resolved form of what the root
        # Cargo.toml declares, so it carries both the repo and the exact commit.
        # Any other source (a crates.io version, a local path) means there is no
        # git repo to look at and the check is skipped.
        #
        # The check runs even when the ZisK one above failed, so that a single
        # run reports both repos instead of one at a time.
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail

          source=$(grep -A3 '^name = "proofman"$' Cargo.lock |
              sed -n 's/^source = "\(.*\)"$/\1/p' | head -n1) || true

          case "$source" in
              git+*\#*) ;;
              *)
                  echo "::notice::proofman is not a git dependency (source: ${source:-none}) — skipping the PROOFMAN_CRATES check"
                  exit 0
                  ;;
          esac

          url=${source#git+}
          url=${url%%\#*}
          url=${url%%\?*}
          commit=${source##*\#}
          dir="$RUNNER_TEMP/pil2-proofman"

          echo "Cloning $url at $commit"

          set -e
          git init -q "$dir"
          git -C "$dir" remote add origin "$url"
          # GitHub serves reachable commits directly, so the common path stays
          # shallow. Fall back to a full fetch on servers that refuse a
          # by-commit request.
          git -C "$dir" fetch -q --depth 1 origin "$commit" ||
              git -C "$dir" fetch -q origin
          git -C "$dir" checkout -q --detach "$commit"

          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Check Proofman crates to publish
        if: ${{ !cancelled() && steps.proofman.outputs.dir != '' }}
        run: tools/crates.io/check_crates_to_publish.sh --proofman-repo-path "${{ steps.proofman.outputs.dir }}"
