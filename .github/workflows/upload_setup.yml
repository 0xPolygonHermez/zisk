name: Upload Setup to bucket

on:
  push:
    branches:
      - develop
      - "pre-develop-[0-9]+.[0-9]+.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Published version"
        required: false
        type: string
        default: ""
      force_upload:
        description: "Force setup upload"
        required: false
        type: boolean
        default: false
      include_dylib:
        description: "Include macOS dylib files"
        required: false
        type: boolean
        default: false
      include_snark:
        description: "Include SNARK artifacts"
        required: false
        type: boolean
        default: false
      include_poseidon1:
        description: "Poseidon1 setup"
        required: false
        type: boolean
        default: true
      include_blake3:
        description: "Blake3 setup"
        required: false
        type: boolean
        default: false

concurrency:
  group: upload-setup
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

env:
  BUCKET: gs://zisk-setup
  TEST_CONTAINER: zisk-gha-upload-setup
  SETUP_STAGE_ROOT: /home/gha/cache-setup/staging

jobs:
  build-setup:
    name: Build setup
    runs-on: gpu-hosted
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      include_dylib: ${{ steps.resolve.outputs.include_dylib }}
      include_snark: ${{ steps.resolve.outputs.include_snark }}
      build_poseidon1: ${{ steps.resolve.outputs.build_poseidon1 }}
      build_blake3: ${{ steps.resolve.outputs.build_blake3 }}
      # JSON array of the selected hash families, for macos-dylibs' matrix.
      modes: ${{ steps.resolve.outputs.modes }}
    steps:
      - name: Fix workspace permissions
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE" || true

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Prepare cache-setup directory
        run: |
          # USE_CACHE_SETUP writes the artifact cache to /home/ziskuser/output
          # (bind-mounted from /home/gha/cache-setup); ziskuser (UID 1000) owns it.
          sudo mkdir -p /home/gha/cache-setup
          sudo chown -R 1000:1000 /home/gha/cache-setup
          sudo chmod -R u+rwX /home/gha/cache-setup

      - name: Give workspace ownership to container user
        run: |
          # The container runs as ziskuser (UID 1000) and writes the build output
          # into the bind-mounted workspace. No GCP auth here: this job uploads
          # nothing to the bucket (the bucket upload happens in upload-setup).
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE"

      - name: Resolve setup version
        id: resolve
        run: |
          # On workflow_dispatch these are the checkboxes; on a push, only the
          # default family (input defaults don't apply to non-dispatch events).
          BUILD_POSEIDON1="${{ (github.event_name != 'workflow_dispatch' || inputs.include_poseidon1) && '1' || '0' }}"
          BUILD_BLAKE3="${{ (github.event_name == 'workflow_dispatch' && inputs.include_blake3) && '1' || '0' }}"
          if [ "$BUILD_POSEIDON1" = "0" ] && [ "$BUILD_BLAKE3" = "0" ]; then
            echo "nothing to build: tick include_poseidon1 and/or include_blake3" >&2
            exit 1
          fi
          MODES=()
          if [ "$BUILD_POSEIDON1" = "1" ]; then MODES+=('"poseidon1"'); fi
          if [ "$BUILD_BLAKE3" = "1" ]; then MODES+=('"blake3"'); fi
          MODES_JSON="[$(IFS=,; echo "${MODES[*]}")]"
          {
            echo "build_poseidon1=$BUILD_POSEIDON1"
            echo "build_blake3=$BUILD_BLAKE3"
            echo "modes=$MODES_JSON"
          } >> "$GITHUB_OUTPUT"
          echo "build_poseidon1: $BUILD_POSEIDON1"
          echo "build_blake3: $BUILD_BLAKE3"
          echo "modes: $MODES_JSON"

          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            # Take the workspace package version from Cargo.toml. Prefix it with
            # "pre-" (e.g. 1.0.0-alpha => pre-1.0.0-alpha) EXCEPT on the develop
            # branch, which publishes the bare Cargo.toml version.
            CARGO_VERSION="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' "$GITHUB_WORKSPACE/Cargo.toml" | head -n1)"
            [ -n "$CARGO_VERSION" ] || { echo "could not read version from Cargo.toml"; exit 1; }
            if [ "${{ github.ref_name }}" = "develop" ]; then
              VERSION="${CARGO_VERSION}"
            else
              VERSION="pre-${CARGO_VERSION}"
            fi
          fi
          [ -n "$VERSION" ] || { echo "could not resolve version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved setup version: $VERSION"

          # macOS dylibs: always on a push to develop; honor the input on workflow_dispatch.
          INCLUDE_DYLIB="${{ ((github.event_name == 'push' && github.ref_name == 'develop') || inputs.include_dylib) && '1' || '0' }}"
          echo "include_dylib=$INCLUDE_DYLIB" >> "$GITHUB_OUTPUT"
          echo "include_dylib: $INCLUDE_DYLIB"

          # SNARK setup: always on a push to develop; honor the input otherwise.
          # Only the Poseidon1 round builds it — blake3 has no SNARK support.
          INCLUDE_SNARK="${{ ((github.event_name == 'push' && github.ref_name == 'develop') || inputs.include_snark) && '1' || '0' }}"
          echo "include_snark=$INCLUDE_SNARK" >> "$GITHUB_OUTPUT"
          echo "include_snark: $INCLUDE_SNARK"

      - name: Prepare staging root
        run: |
          # This workspace is shared with other workflows whose actions/checkout
          # wipes build/, and upload-setup only runs hours later. So each round
          # parks its setup at <stage>/<run_id>/<mode>/ until then.
          STAGE="${SETUP_STAGE_ROOT}/${{ github.run_id }}"
          sudo mkdir -p "${SETUP_STAGE_ROOT}"
          # Backstop for runs that never reach upload-setup's cleanup step.
          sudo find "${SETUP_STAGE_ROOT}" -mindepth 1 -maxdepth 1 -type d -mtime +1 \
            -exec rm -rf {} + || true
          sudo rm -rf "$STAGE"
          sudo mkdir -p "$STAGE"
          sudo chown 1000:1000 "${SETUP_STAGE_ROOT}" "$STAGE"   # container user

      - name: Start upload setup container
        run: .github/scripts/start_test_container.sh

      - name: Build ZisK
        run: |
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./build_zisk.sh
            '

      - name: Build setup (Poseidon1)
        if: ${{ steps.resolve.outputs.build_poseidon1 == '1' }}
        env:
          HASH_MODE: Poseidon1
          INCLUDE_SNARK: ${{ steps.resolve.outputs.include_snark }}
          # include_dylib (resolved) -> DYLIB_INPUT_FILES (stage the macOS dylib inputs).
          DYLIB_INPUT_FILES: ${{ steps.resolve.outputs.include_dylib }}
          PTAU_PATH: /home/ziskuser/output/powersOfTau28_hez_final_24.ptau
        run: |
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -e USE_CACHE_SETUP="1" \
            -e HASH_MODE="$HASH_MODE" \
            -e INCLUDE_SNARK="$INCLUDE_SNARK" \
            -e DYLIB_INPUT_FILES="$DYLIB_INPUT_FILES" \
            -e PTAU_PATH="$PTAU_PATH" \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./build_setup.sh
            '

      - name: Stage setup outputs (Poseidon1)
        if: ${{ steps.resolve.outputs.build_poseidon1 == '1' }}
        run: |
          STAGE="${SETUP_STAGE_ROOT}/${{ github.run_id }}/poseidon1"
          sudo mkdir -p "$STAGE"
          sudo chown 1000:1000 "$STAGE"   # container user
          for d in provingKey provingKeySnark circom; do
            [ -d "$GITHUB_WORKSPACE/build/$d" ] || continue
            echo "staging build/$d -> $STAGE/$d"
            sudo mv "$GITHUB_WORKSPACE/build/$d" "$STAGE/$d"
          done
          ls -la "$STAGE"

      - name: Upload dylib input files artifact (Poseidon1)
        if: ${{ steps.resolve.outputs.build_poseidon1 == '1' && steps.resolve.outputs.include_dylib == '1' }}
        uses: actions/upload-artifact@v4
        with:
          # build/dylib_input holds what compiling the macOS dylibs needs. It is
          # per-setup, so each hash family gets its own artifact.
          name: dylib-input-${{ steps.resolve.outputs.version }}-poseidon1
          path: build/dylib_input/
          if-no-files-found: error
          retention-days: 1

      - name: Build setup (Blake3)
        if: ${{ steps.resolve.outputs.build_blake3 == '1' }}
        env:
          HASH_MODE: blake3
          INCLUDE_SNARK: "0"
          DYLIB_INPUT_FILES: ${{ steps.resolve.outputs.include_dylib }}
        run: |
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -e USE_CACHE_SETUP="1" \
            -e HASH_MODE="$HASH_MODE" \
            -e INCLUDE_SNARK="$INCLUDE_SNARK" \
            -e DYLIB_INPUT_FILES="$DYLIB_INPUT_FILES" \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./build_setup.sh
            '

      - name: Stage setup outputs (Blake3)
        if: ${{ steps.resolve.outputs.build_blake3 == '1' }}
        run: |
          STAGE="${SETUP_STAGE_ROOT}/${{ github.run_id }}/blake3"
          sudo mkdir -p "$STAGE"
          sudo chown 1000:1000 "$STAGE"   # container user
          for d in provingKey provingKeySnark circom; do
            [ -d "$GITHUB_WORKSPACE/build/$d" ] || continue
            echo "staging build/$d -> $STAGE/$d"
            sudo mv "$GITHUB_WORKSPACE/build/$d" "$STAGE/$d"
          done
          ls -la "$STAGE"

      - name: Upload dylib input files artifact (Blake3)
        if: ${{ steps.resolve.outputs.build_blake3 == '1' && steps.resolve.outputs.include_dylib == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: dylib-input-${{ steps.resolve.outputs.version }}-blake3
          path: build/dylib_input/
          if-no-files-found: error
          retention-days: 1

  macos-dylibs:
    name: Build macOS dylibs (${{ matrix.mode }})
    needs: build-setup
    if: ${{ needs.build-setup.outputs.include_dylib == '1' }}
    runs-on: macos-14
    timeout-minutes: 240
    strategy:
      # The two setups are independent, so let both report. upload-setup still
      # gates on the whole job succeeding, so a half-built pair is never published.
      fail-fast: false
      matrix:
        # Only the families build-setup generated; the values are its staging dirs.
        mode: ${{ fromJSON(needs.build-setup.outputs.modes) }}
    defaults:
      run:
        shell: bash
    env:
      ZISK_GHA: "1"
      ZISK_REPO_DIR: ${{ github.workspace }}
      TERM: xterm
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./install_deps.sh

      - name: Build ZisK
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./build_zisk.sh

      - name: Download dylib input files artifact
        uses: actions/download-artifact@v4
        with:
          name: dylib-input-${{ needs.build-setup.outputs.version }}-${{ matrix.mode }}
          path: build

      - name: Build dylib files
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./build_dylib.sh

      - name: Upload dylib files artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylibs-${{ needs.build-setup.outputs.version }}-${{ matrix.mode }}
          path: build/dylib
          if-no-files-found: error
          retention-days: 1

  upload-setup:
    name: Upload setup artifacts to bucket
    runs-on: gpu-hosted
    timeout-minutes: 120
    needs: [build-setup, macos-dylibs]
    # Run only if build-setup succeeded and macos-dylibs succeeded or was skipped
    # (it's skipped when include_dylib is false). always() is needed so a skipped
    # macos-dylibs doesn't skip this job too.
    if: ${{ always() && needs.build-setup.result == 'success' && (needs.macos-dylibs.result == 'success' || needs.macos-dylibs.result == 'skipped') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Fix workspace permissions
        run: |
          # Reclaim the workspace (left owned by ziskuser/1000 by build-setup) so
          # the runner user can write the downloaded artifact and the GCP creds.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE" || true

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          # Another workflow may have left this shared workspace on a different ref:
          # the scripts run below and the sources hashed into the published .hash
          # sidecar must come from this run's commit. clean: false resets only
          # tracked files, keeping build/ and target/.
          clean: false

      - name: Clear stale dylib directories
        run: |
          # The artifact downloads below merge into these paths, so clear them.
          sudo rm -rf "$GITHUB_WORKSPACE"/build/dylib "$GITHUB_WORKSPACE"/build/dylib-*

      - name: Download dylib artifact (Poseidon1)
        if: ${{ needs.build-setup.outputs.build_poseidon1 == '1' && needs.build-setup.outputs.include_dylib == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: dylibs-${{ needs.build-setup.outputs.version }}-poseidon1
          path: build/dylib-poseidon1

      - name: Download dylib artifact (Blake3)
        if: ${{ needs.build-setup.outputs.build_blake3 == '1' && needs.build-setup.outputs.include_dylib == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: dylibs-${{ needs.build-setup.outputs.version }}-blake3
          path: build/dylib-blake3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Workload Identity Federation (keyless). Writes a credentials file into
          # GITHUB_WORKSPACE and exports GOOGLE_GHA_CREDS_PATH; gcloud runs inside
          # the build-setup container (still up — it has no stop step).
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Give workspace ownership to container user
        run: |
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE"

          # Translate the host credentials-file path to its path inside the
          # container (GITHUB_WORKSPACE is bind-mounted at /workspace/zisk) and
          # expose it to the gcloud-using container step below.
          rel="${GOOGLE_GHA_CREDS_PATH#"$GITHUB_WORKSPACE"/}"
          [ "$rel" != "$GOOGLE_GHA_CREDS_PATH" ] || {
            echo "credentials file '$GOOGLE_GHA_CREDS_PATH' is not under GITHUB_WORKSPACE" >&2; exit 1; }
          echo "CONTAINER_GCP_CREDS=/workspace/zisk/$rel" >> "$GITHUB_ENV"

      - name: Restore staged setup (Poseidon1)
        if: ${{ needs.build-setup.outputs.build_poseidon1 == '1' }}
        run: |
          STAGE="${SETUP_STAGE_ROOT}/${{ github.run_id }}/poseidon1"
          [ -d "$STAGE/provingKey" ] || {
            echo "staged provingKey not found at $STAGE" >&2; exit 1; }
          sudo mkdir -p "$GITHUB_WORKSPACE/build"
          # upload_setup.sh writes the tarballs into build/ as ziskuser.
          sudo chown 1000:1000 "$GITHUB_WORKSPACE/build"
          for d in provingKey provingKeySnark circom; do
            sudo rm -rf "$GITHUB_WORKSPACE/build/$d"
            [ -d "$STAGE/$d" ] || continue
            echo "restoring $STAGE/$d -> build/$d"
            sudo mv "$STAGE/$d" "$GITHUB_WORKSPACE/build/$d"
          done

      - name: Upload setup (Poseidon1)
        if: ${{ needs.build-setup.outputs.build_poseidon1 == '1' }}
        env:
          # Empty: this variant owns the default artifact names.
          SETUP_NAME_SUFFIX: ""
          # force_upload input -> FORCE_UPLOAD (upload even if the bucket .hash matches).
          FORCE_UPLOAD: ${{ inputs.force_upload && '1' || '0' }}
          # include_dylib (resolved) -> merge the macOS dylibs into provingKey on upload.
          INCLUDE_DYLIB: ${{ needs.build-setup.outputs.include_dylib }}
        run: |
          # SETUP_DYLIB_DIR is a container path (workspace is at /workspace/zisk),
          # per variant: each key has its own witness libs.
          DYLIB_ARGS=()
          if [ "$INCLUDE_DYLIB" = "1" ]; then
            DYLIB_ARGS=(-e SETUP_ADD_DYLIBS="1" -e SETUP_DYLIB_DIR="/workspace/zisk/build/dylib-poseidon1")
          fi
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -e SETUP_VERSION="${{ needs.build-setup.outputs.version }}" \
            -e SETUP_NAME_SUFFIX="$SETUP_NAME_SUFFIX" \
            -e FORCE_UPLOAD="$FORCE_UPLOAD" \
            -e SETUP_PRUNE_LOCAL="1" \
            "${DYLIB_ARGS[@]}" \
            -e CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="$CONTAINER_GCP_CREDS" \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./upload_setup.sh
            '

      - name: Restore staged setup (Blake3)
        if: ${{ needs.build-setup.outputs.build_blake3 == '1' }}
        run: |
          STAGE="${SETUP_STAGE_ROOT}/${{ github.run_id }}/blake3"
          [ -d "$STAGE/provingKey" ] || {
            echo "staged provingKey not found at $STAGE" >&2; exit 1; }
          sudo mkdir -p "$GITHUB_WORKSPACE/build"
          # upload_setup.sh writes the tarballs into build/ as ziskuser.
          sudo chown 1000:1000 "$GITHUB_WORKSPACE/build"
          for d in provingKey provingKeySnark circom; do
            sudo rm -rf "$GITHUB_WORKSPACE/build/$d"
            [ -d "$STAGE/$d" ] || continue
            echo "restoring $STAGE/$d -> build/$d"
            sudo mv "$STAGE/$d" "$GITHUB_WORKSPACE/build/$d"
          done

      - name: Upload setup (Blake3)
        if: ${{ needs.build-setup.outputs.build_blake3 == '1' }}
        env:
          SETUP_NAME_SUFFIX: "-blake3"
          FORCE_UPLOAD: ${{ inputs.force_upload && '1' || '0' }}
          INCLUDE_DYLIB: ${{ needs.build-setup.outputs.include_dylib }}
        run: |
          # SETUP_DYLIB_DIR is a container path (workspace is at /workspace/zisk),
          # per variant: each key has its own witness libs.
          DYLIB_ARGS=()
          if [ "$INCLUDE_DYLIB" = "1" ]; then
            DYLIB_ARGS=(-e SETUP_ADD_DYLIBS="1" -e SETUP_DYLIB_DIR="/workspace/zisk/build/dylib-blake3")
          fi
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -e SETUP_VERSION="${{ needs.build-setup.outputs.version }}" \
            -e SETUP_NAME_SUFFIX="$SETUP_NAME_SUFFIX" \
            -e FORCE_UPLOAD="$FORCE_UPLOAD" \
            -e SETUP_PRUNE_LOCAL="1" \
            "${DYLIB_ARGS[@]}" \
            -e CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="$CONTAINER_GCP_CREDS" \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./upload_setup.sh
            '

      - name: Cleanup build artifacts
        run: |
          sudo rm -rf \
            "$GITHUB_WORKSPACE"/build/provingKey \
            "$GITHUB_WORKSPACE"/build/provingKeySnark \
            "$GITHUB_WORKSPACE"/build/circom \
            "$GITHUB_WORKSPACE"/build/build \
            "$GITHUB_WORKSPACE"/build/pil \
            "$GITHUB_WORKSPACE"/build/dylib_input \
            "$GITHUB_WORKSPACE"/build/dylib \
            "$GITHUB_WORKSPACE"/build/dylib-* \
            "$GITHUB_WORKSPACE"/tmp/fixed
          df -h /home/gha "$GITHUB_WORKSPACE" || true

      - name: Stop upload setup container
        if: always()
        run: |
          docker rm -f "${TEST_CONTAINER}" || true
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE" || true

  cleanup:
    name: Clean up staged setup
    runs-on: gpu-hosted
    needs: [build-setup, macos-dylibs, upload-setup]
    # always(): the staged setup must go whatever happened upstream, including when
    # upload-setup was skipped and never consumed it.
    if: ${{ always() }}
    steps:
      - name: Remove staging directory
        run: sudo rm -rf "${SETUP_STAGE_ROOT}/${{ github.run_id }}"
