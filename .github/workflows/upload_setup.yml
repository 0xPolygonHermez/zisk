name: Upload Setup to bucket

on:
  push:
    branches:
      - develop
      - "pre-develop-[0-9]+.[0-9]+.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Published version"
        required: false
        type: string
        default: ""
      force_upload:
        description: "Force setup upload"
        required: false
        type: boolean
        default: false
      include_dylib:
        description: "Include macOS dylib files"
        required: false
        type: boolean
        default: false
      include_snark:
        description: "Include SNARK artifacts"
        required: false
        type: boolean
        default: false

concurrency:
  group: upload-setup
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

env:
  BUCKET: gs://zisk-setup
  TEST_CONTAINER: zisk-gha-upload-setup
  SETUP_STAGE_ROOT: /home/gha/cache-setup/staging

jobs:
  build-setup:
    name: Build setup
    runs-on: gpu-hosted
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      include_dylib: ${{ steps.resolve.outputs.include_dylib }}
      include_snark: ${{ steps.resolve.outputs.include_snark }}
    steps:
      - name: Fix workspace permissions
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE" || true

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Prepare cache-setup directory
        run: |
          # USE_CACHE_SETUP writes the artifact cache to /home/ziskuser/output
          # (bind-mounted from /home/gha/cache-setup); ziskuser (UID 1000) owns it.
          sudo mkdir -p /home/gha/cache-setup
          sudo chown -R 1000:1000 /home/gha/cache-setup
          sudo chmod -R u+rwX /home/gha/cache-setup

      - name: Give workspace ownership to container user
        run: |
          # The container runs as ziskuser (UID 1000) and writes the build output
          # into the bind-mounted workspace. No GCP auth here: this job uploads
          # nothing to the bucket (the bucket upload happens in upload-setup).
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE"

      - name: Resolve setup version
        id: resolve
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            # Take the workspace package version from Cargo.toml. Prefix it with
            # "pre-" (e.g. 1.0.0-alpha => pre-1.0.0-alpha) EXCEPT on the develop
            # branch, which publishes the bare Cargo.toml version.
            CARGO_VERSION="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' "$GITHUB_WORKSPACE/Cargo.toml" | head -n1)"
            [ -n "$CARGO_VERSION" ] || { echo "could not read version from Cargo.toml"; exit 1; }
            if [ "${{ github.ref_name }}" = "develop" ]; then
              VERSION="${CARGO_VERSION}"
            else
              VERSION="pre-${CARGO_VERSION}"
            fi
          fi
          [ -n "$VERSION" ] || { echo "could not resolve version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved setup version: $VERSION"

          # macOS dylibs: always on a push to develop; honor the input on workflow_dispatch.
          INCLUDE_DYLIB="${{ ((github.event_name == 'push' && github.ref_name == 'develop') || inputs.include_dylib) && '1' || '0' }}"
          echo "include_dylib=$INCLUDE_DYLIB" >> "$GITHUB_OUTPUT"
          echo "include_dylib: $INCLUDE_DYLIB"

          # SNARK setup: always on a push to develop; honor the input otherwise.
          INCLUDE_SNARK="${{ ((github.event_name == 'push' && github.ref_name == 'develop') || inputs.include_snark) && '1' || '0' }}"
          echo "include_snark=$INCLUDE_SNARK" >> "$GITHUB_OUTPUT"
          echo "include_snark: $INCLUDE_SNARK"

      - name: Start upload setup container
        run: .github/scripts/start_test_container.sh

      - name: Build ZisK
        run: |
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./build_zisk.sh
            '

      - name: Build setup
        env:
          # include_snark (resolved) -> INCLUDE_SNARK (also build the snark setup).
          INCLUDE_SNARK: ${{ steps.resolve.outputs.include_snark }}
          # include_dylib (resolved) -> DYLIB_INPUT_FILES (stage the macOS dylib inputs).
          DYLIB_INPUT_FILES: ${{ steps.resolve.outputs.include_dylib }}
          # Cache the (~18 GB) powers-of-tau in the persistent, writable output mount
          PTAU_PATH: /home/ziskuser/output/powersOfTau28_hez_final_24.ptau
        run: |
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -e USE_CACHE_SETUP="1" \
            -e INCLUDE_SNARK="$INCLUDE_SNARK" \
            -e PTAU_PATH="$PTAU_PATH" \
            -e DYLIB_INPUT_FILES="$DYLIB_INPUT_FILES" \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./build_setup.sh
            '

      - name: Upload dylib input files artifact
        if: ${{ steps.resolve.outputs.include_dylib == '1' }}
        uses: actions/upload-artifact@v4
        with:
          # build/dylib_input is produced by build_setup.sh (DYLIB_INPUT_FILES=1):
          # it contains the input files needed to compile the macOS dylib files.
          name: dylib-input-${{ steps.resolve.outputs.version }}
          path: build/dylib_input/
          if-no-files-found: error
          retention-days: 1

      - name: Stage setup outputs outside the workspace
        run: |
          # This workspace is shared with other workflows on the zisk-gpu runner
          # group (pr.yml's test-x86_64), whose actions/checkout wipes build/ with
          # `git clean -ffdx` — and upload-setup only runs hours later, after
          # macos-dylibs. So park this run's setup outside the workspace; upload-setup
          # moves it back before packing.
          STAGE="${SETUP_STAGE_ROOT}/${{ github.run_id }}"
          sudo mkdir -p "${SETUP_STAGE_ROOT}"
          # Backstop for runs that never reach upload-setup's cleanup step.
          sudo find "${SETUP_STAGE_ROOT}" -mindepth 1 -maxdepth 1 -type d -mtime +1 \
            -exec rm -rf {} + || true
          sudo rm -rf "$STAGE"
          sudo mkdir -p "$STAGE"
          sudo chown 1000:1000 "${SETUP_STAGE_ROOT}" "$STAGE"   # container user
          for d in provingKey provingKeySnark circom; do
            [ -d "$GITHUB_WORKSPACE/build/$d" ] || continue
            echo "staging build/$d -> $STAGE/$d"
            sudo mv "$GITHUB_WORKSPACE/build/$d" "$STAGE/$d"
          done
          ls -la "$STAGE"

  macos-dylibs:
    name: Build macOS dylibs
    needs: build-setup
    if: ${{ needs.build-setup.outputs.include_dylib == '1' }}
    runs-on: macos-14
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      ZISK_GHA: "1"
      ZISK_REPO_DIR: ${{ github.workspace }}
      TERM: xterm
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./install_deps.sh

      - name: Build ZisK
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./build_zisk.sh

      - name: Download dylib input files artifact
        uses: actions/download-artifact@v4
        with:
          name: dylib-input-${{ needs.build-setup.outputs.version }}
          path: build

      - name: Build dylib files
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./build_dylib.sh

      - name: Upload dylib files artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylibs-${{ needs.build-setup.outputs.version }}
          path: build/dylib
          if-no-files-found: error
          retention-days: 1

  upload-setup:
    name: Upload setup artifacts to bucket
    runs-on: gpu-hosted
    timeout-minutes: 60
    needs: [build-setup, macos-dylibs]
    # Run only if build-setup succeeded and macos-dylibs succeeded or was skipped
    # (it's skipped when include_dylib is false). always() is needed so a skipped
    # macos-dylibs doesn't skip this job too.
    if: ${{ always() && needs.build-setup.result == 'success' && (needs.macos-dylibs.result == 'success' || needs.macos-dylibs.result == 'skipped') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Fix workspace permissions
        run: |
          # Reclaim the workspace (left owned by ziskuser/1000 by build-setup) so
          # the runner user can write the downloaded artifact and the GCP creds.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE" || true

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          # Another workflow may have left this shared workspace on a different ref:
          # the scripts run below and the sources hashed into the published .hash
          # sidecar must come from this run's commit. clean: false resets only
          # tracked files, keeping build/ and target/.
          clean: false

      - name: Restore staged setup into the workspace
        run: |
          # Replaces whatever build/ holds now — another job on this runner may have
          # left a provingKey built from a different commit.
          STAGE="${SETUP_STAGE_ROOT}/${{ github.run_id }}"
          [ -d "$STAGE/provingKey" ] || {
            echo "staged provingKey not found at $STAGE" >&2; exit 1; }
          sudo mkdir -p "$GITHUB_WORKSPACE/build"
          for d in provingKey provingKeySnark circom; do
            [ -d "$STAGE/$d" ] || continue
            echo "restoring $STAGE/$d -> build/$d"
            sudo rm -rf "$GITHUB_WORKSPACE/build/$d"
            sudo mv "$STAGE/$d" "$GITHUB_WORKSPACE/build/$d"
          done
          # Leftover from an earlier run: the artifact download below merges into it.
          sudo rm -rf "$GITHUB_WORKSPACE/build/dylib"

      - name: Download dylib artifact
        if: ${{ needs.build-setup.outputs.include_dylib == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: dylibs-${{ needs.build-setup.outputs.version }}
          path: build/dylib

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Workload Identity Federation (keyless). Writes a credentials file into
          # GITHUB_WORKSPACE and exports GOOGLE_GHA_CREDS_PATH; gcloud runs inside
          # the build-setup container (still up — it has no stop step).
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Give workspace ownership to container user
        run: |
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE"

          # Translate the host credentials-file path to its path inside the
          # container (GITHUB_WORKSPACE is bind-mounted at /workspace/zisk) and
          # expose it to the gcloud-using container step below.
          rel="${GOOGLE_GHA_CREDS_PATH#"$GITHUB_WORKSPACE"/}"
          [ "$rel" != "$GOOGLE_GHA_CREDS_PATH" ] || {
            echo "credentials file '$GOOGLE_GHA_CREDS_PATH' is not under GITHUB_WORKSPACE" >&2; exit 1; }
          echo "CONTAINER_GCP_CREDS=/workspace/zisk/$rel" >> "$GITHUB_ENV"

      - name: Upload setup
        env:
          # force_upload input -> FORCE_UPLOAD (upload even if the bucket .hash matches).
          FORCE_UPLOAD: ${{ inputs.force_upload && '1' || '0' }}
          # include_dylib (resolved) -> merge the macOS dylibs into provingKey on upload.
          INCLUDE_DYLIB: ${{ needs.build-setup.outputs.include_dylib }}
        run: |
          # Only merge the macOS dylibs when include_dylib is set. SETUP_DYLIB_DIR is
          # the container path (the workspace is bind-mounted at /workspace/zisk).
          DYLIB_ARGS=()
          if [ "$INCLUDE_DYLIB" = "1" ]; then
            DYLIB_ARGS=(-e SETUP_ADD_DYLIBS="1" -e SETUP_DYLIB_DIR="/workspace/zisk/build/dylib")
          fi
          .github/scripts/docker_exec.sh \
            -u ziskuser \
            -e SETUP_VERSION="${{ needs.build-setup.outputs.version }}" \
            -e FORCE_UPLOAD="$FORCE_UPLOAD" \
            "${DYLIB_ARGS[@]}" \
            -e CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="$CONTAINER_GCP_CREDS" \
            -- bash -lc '
              cd /workspace/zisk/tools/test-env
              ./upload_setup.sh
            '

      - name: Stop upload setup container
        if: always()
        run: |
          docker rm -f "${TEST_CONTAINER}" || true
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE" || true

  cleanup:
    name: Clean up staged setup
    runs-on: gpu-hosted
    needs: [build-setup, macos-dylibs, upload-setup]
    # always(): the staged setup must go whatever happened upstream, including when
    # upload-setup was skipped and never consumed it.
    if: ${{ always() }}
    steps:
      - name: Remove staging directory
        run: sudo rm -rf "${SETUP_STAGE_ROOT}/${{ github.run_id }}"
