name: Test ZisK Installation (binaries)

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  check-latest-release:
    name: Check if release published
    runs-on: ubuntu-latest
    steps:
      - name: Check if the release is latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'release'
        run: |
          sudo apt update
          sudo apt install -y gh

          LATEST_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')
          CURRENT_TAG="${{ github.event.release.tag_name }}"

          echo "Latest release tag: $LATEST_TAG"
          echo "Current release tag: $CURRENT_TAG"

          if [[ "$CURRENT_TAG" == "$LATEST_TAG" ]]; then
            echo "This is the latest release!"
          else
            echo "This is NOT the latest release. Exiting..."
            exit 0
          fi

  # The same test runs twice: the CPU variant on the rocket runner, which has no
  # GPU, and the GPU variant on the zisk-gpu runner group. They are independent
  # (each one clones the repository and starts its own container) so they run in
  # parallel, and both share the steps through the install_from_binaries
  # reusable workflow.
  install-from-binaries-cpu:
    name: Install ZisK from binaries (CPU)
    needs: check-latest-release
    uses: ./.github/workflows/install_from_binaries.yml
    with:
      runner: '"rocket"'
      variant: cpu

  install-from-binaries-gpu:
    name: Install ZisK from binaries (GPU)
    needs: check-latest-release
    uses: ./.github/workflows/install_from_binaries.yml
    with:
      runner: '{"group":"zisk-gpu"}'
      variant: gpu
