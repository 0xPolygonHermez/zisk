name: Test ZisK Installation (binaries)

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  check-latest-release:
    name: Check if release published
    runs-on: ubuntu-latest
    steps:
      - name: Check if the release is latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'release'
        run: |
          sudo apt update
          sudo apt install -y gh

          LATEST_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')
          CURRENT_TAG="${{ github.event.release.tag_name }}"

          echo "Latest release tag: $LATEST_TAG"
          echo "Current release tag: $CURRENT_TAG"

          if [[ "$CURRENT_TAG" == "$LATEST_TAG" ]]; then
            echo "This is the latest release!"
          else
            echo "This is NOT the latest release. Exiting..."
            exit 0
          fi

  install-from-binaries:
    name: Install ZisK from binaries
    needs: check-latest-release
    runs-on: rocket
    container:
      image: ubuntu:22.04
    timeout-minutes: 60
    env:
      CARGO_HOME: /github/home/.cargo
      RUSTUP_HOME: /github/home/.rustup
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0

    steps:
      - name: Clean home directory
        run: |
          find $HOME -mindepth 1 -delete || true
          ls -la $HOME
          rm -rf refs/heads/feature/gha-test-install-bin

      - name: Check resources
        run: |
          echo "CPUs: $(nproc)"
          free -h

      - name: Install tools
        run: apt-get update && apt-get install -y curl git

      - name: Install rust toolchain
        id: rustc-toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: default
          override: true

      - name: Install ZisK dependencies
        shell: bash
        run: |
          apt-get install -y \
            xz-utils jq curl build-essential qemu-system libomp-dev libgmp-dev \
            nlohmann-json3-dev protobuf-compiler uuid-dev libgrpc++-dev \
            libsecp256k1-dev libsodium-dev libpqxx-dev nasm libopenmpi-dev \
            openmpi-bin openmpi-common libclang-dev clang gcc-riscv64-unknown-elf

      - name: Install and run ziskup
        run: |
          curl -s -o install.sh https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/install.sh
          chmod +x install.sh
          export GH_RUNNER=1
          ./install.sh

      - name: Set stable as default Rust toolchain
        run: rustup default stable

      - name: Add ZisK bin directory to PATH
        run: echo "$HOME/.zisk/bin" >> $GITHUB_PATH

      - name: Install PLONK setup
        shell: bash
        run: |
          if ! ziskup setup_snark; then
            echo "❌ Install PLONK setup failed"
            exit 1
          fi

      - name: Clone ZisK repository
        shell: bash
        run: |
          git clone https://github.com/0xPolygonHermez/zisk.git

      - name: Build guest
        shell: bash
        working-directory: zisk/examples/hash/guest
        run: |
          cargo-zisk build --release
          # Check hash-guest elf has been generated
          ELF=target/elf/riscv64ima-zisk-zkvm-elf/release/hash-guest
          if [ ! -f "$ELF" ]; then
            echo "❌ Build guest failed: $ELF not found"
            exit 1
          fi
          echo "✅ $ELF generated"

      - name: Run guest
        shell: bash
        working-directory: zisk/examples/hash/guest
        run: |
          cargo-zisk run --release -i samples/example-input.bin 2>&1 | tee run_output.log
          if ! grep -F "SHA-256('Hello World!') => 0x7f83b1657ff1fc53b92dc18148a1d65dfc2d4b1fa3d677284addd200126d9069" run_output.log; then
            echo "❌ Run guest failed"
            exit 1
          fi

      - name: Setup guest
        shell: bash
        working-directory: zisk/examples/hash/guest
        run: |
          cargo-zisk setup --release 2>&1 | tee setup_output.log
          if ! grep -F "INFO: Hash ID: 219ce6c86862fe56c557e2d5f473de7d73f4e11bc0b61ac3185443a494b488ce" setup_output.log; then
            echo "❌ Setup guest failed"
            exit 1
          fi

      - name: Prove guest (emulator)
        shell: bash
        working-directory: zisk/examples/hash/guest
        run: |
          cargo-zisk prove --release -i samples/example-input.bin -o proof.bin 2>&1 | tee prove_output.log
          if ! grep -F "INFO: Proof saved to proof.bin" prove_output.log; then
            echo "❌ Prove guest failed"
            exit 1
          fi
          cargo-zisk verify -p proof.bin 2>&1 | tee verify_output.log
          if ! grep -F "STARK proof was verified" verify_output.log; then
            echo "❌ Verify proof failed"
            exit 1
          fi


      - name: Prove guest (asm)
        shell: bash
        working-directory: zisk/examples/hash/guest
        run: |
          cargo-zisk prove --release -i samples/example-input.bin -o proof.bin --asm 2>&1 | tee prove_output.log
          if ! grep -F "INFO: Proof saved to proof.bin" prove_output.log; then
            echo "❌ Prove guest failed"
            exit 1
          fi
          cargo-zisk verify -p proof.bin 2>&1 | tee verify_output.log
          if ! grep -F "STARK proof was verified" verify_output.log; then
            echo "❌ Verify proof failed"
            exit 1
          fi


      - name: Prove guest (emulator, plonk)
        shell: bash
        working-directory: zisk/examples/hash/guest
        run: |
          cargo-zisk prove --release -i samples/example-input.bin -o proof.bin --plonk 2>&1 | tee prove_output.log
          if ! grep -F "INFO: Proof saved to proof.bin" prove_output.log; then
            echo "❌ Prove guest failed"
            exit 1
          fi
          cargo-zisk verify -p proof.bin 2>&1 | tee verify_output.log
          if ! grep -F "PLONK proof was verified" verify_output.log; then
            echo "❌ Verify proof failed"
            exit 1
          fi

      - name: Prove guest (asm, plonk)
        shell: bash
        working-directory: zisk/examples/hash/guest
        run: |
          cargo-zisk prove --release -i samples/example-input.bin -o proof.bin --plonk --asm 2>&1 | tee prove_output.log
          if ! grep -F "INFO: Proof saved to proof.bin" prove_output.log; then
            echo "❌ Prove guest failed"
            exit 1
          fi
          cargo-zisk verify -p proof.bin 2>&1 | tee verify_output.log
          if ! grep -F "PLONK proof was verified" verify_output.log; then
            echo "❌ Verify proof failed"
            exit 1
          fi

      - name: Run via SDK (emulator)
        shell: bash
        working-directory: zisk/examples/hash/host
        run: |
          cargo run --release 2>&1 | tee sdk_output.log
          if ! grep -F "sha256('Hello Zisk!') => 0xd3e33ed651e7c8d8d4e30ce9a3e4a40e9f089f22435e279a84ea5f8ae234eead" sdk_output.log; then
            echo "❌ Run via SDK failed"
            exit 1
          fi

      - name: Run via SDK (asm)
        shell: bash
        working-directory: zisk/examples/hash/host
        run: |
          cargo run --release 2>&1 | tee sdk_output.log
          if ! grep -F "sha256('Hello Zisk!') => 0xd3e33ed651e7c8d8d4e30ce9a3e4a40e9f089f22435e279a84ea5f8ae234eead" sdk_output.log; then
            echo "❌ Run via SDK failed"
            exit 1
          fi
