name: Riscof Tests

on:
  pull_request:
    branches:
      - develop
      - main
      - "pre-develop-[0-9]+.[0-9]+.[0-9]*"
    paths:
      - "emulator/**"
      - "emulator-asm/**"
      - "riscv/**"
      - "core/**"
      - "lib-c/**"
      - "lib-float/**"
      - "transpilers/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  riscof-elf-tests-rust:
    name: Riscof ELF tests (rust emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      ZISK_GHA: "1"
      ZISK_REPO_DIR: ${{ github.workspace }}
      TERM: xterm
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Resolve zisk-testvectors branch
        id: testvectors_branch
        run: |
          branch=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.metadata.gha_zisk_testvectors_branch // ""')
          if [ -z "$branch" ] || [ "$branch" = "null" ]; then
            branch="main"
          fi
          echo "Using zisk-testvectors branch: $branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout zisk-testvectors repo
        uses: actions/checkout@v4
        with:
          repository: 0xPolygonHermez/zisk-testvectors
          ref: ${{ steps.testvectors_branch.outputs.branch }}
          path: zisk-testvectors

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          sudo ./install_deps.sh

      - name: Emulate in rust Riscof ELF files
        run: |
          . "$HOME/.cargo/env"
          cd "$GITHUB_WORKSPACE"
          sudo ./tools/emulate_all.sh $GITHUB_WORKSPACE/zisk-testvectors/riscof/riscof_work

