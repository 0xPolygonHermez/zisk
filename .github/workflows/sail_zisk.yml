name: sail-zisk checks

# The transpiler against its Lean spec (make transpiler-check), with the
# RISC-V architectural tests it reads, difftested on ziskemu, sail-zisk and
# ZisK's RISC-V machine (make compliance): on pull requests that touch the
# transpiler, the ROM layout, the difftest tool or sail-zisk, and nightly.
# The transpiler's decoder against sail-riscv's (make decoder-diff): nightly.
# See sail-zisk/README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - develop
      - main
      - "pre-develop-[0-9]+.[0-9]+.[0-9]*"
    paths:
      - 'sail-zisk/**'
      - 'transpilers/riscv/**'
      - 'core/src/**'
      - 'tools/sail-difftest/**'
      - '.github/workflows/sail_zisk.yml'
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  transpiler-check:
    name: Transpiler spec and compliance
    # As in pr.yml: fork-PR code reaches the self-hosted runners only with the
    # ci:full label.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: rocket
    container:
      image: ubuntu:22.04
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      SAIL_ZISK_TOOLS: /github/home/sail-zisk-tools
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean workspace
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          fi

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./install_deps.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore the tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.opam
            ~/.elan
            /github/home/sail-zisk-tools
          key: sail-zisk-tools-${{ hashFiles('sail-zisk/ci/setup.sh', 'sail-zisk/lean/lean-toolchain') }}

      - name: Install the tools
        run: sail-zisk/ci/setup.sh

      - name: Restore the generated models
        uses: actions/cache@v4
        with:
          path: |
            sail-zisk/build/sail-riscv
            sail-zisk/build/riscv-lean
            sail-zisk/build/riscv
          key: sail-zisk-riscv-${{ hashFiles('sail-zisk/Makefile', 'sail-zisk/riscv/**') }}

      - name: Generate the models
        working-directory: sail-zisk
        run: |
          make lean
          make riscv
          make riscv-run
          make riscv-sim
          make emu

      - name: Architectural tests
        working-directory: sail-zisk
        run: make compliance ARCH_TEST="$ARCH_TEST" RISCV_GCC="$RISCV_GCC"

      - name: Transpiler against its spec
        working-directory: sail-zisk
        run: make transpiler-check RISCV_GCC="$RISCV_GCC"

  decoder-diff:
    name: Transpiler decoder against sail-riscv's
    if: github.event_name != 'pull_request'
    runs-on: rocket
    container:
      image: ubuntu:22.04
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      SAIL_ZISK_TOOLS: /github/home/sail-zisk-tools
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean workspace
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          fi

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./install_deps.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore the tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.opam
            ~/.elan
            /github/home/sail-zisk-tools
          key: sail-zisk-tools-${{ hashFiles('sail-zisk/ci/setup.sh', 'sail-zisk/lean/lean-toolchain') }}

      - name: Install the tools
        run: sail-zisk/ci/setup.sh

      - name: Restore the generated models
        uses: actions/cache@v4
        with:
          path: |
            sail-zisk/build/sail-riscv
            sail-zisk/build/riscv-lean
            sail-zisk/build/riscv
          key: sail-zisk-riscv-${{ hashFiles('sail-zisk/Makefile', 'sail-zisk/riscv/**') }}

      - name: Generate the models
        working-directory: sail-zisk
        run: |
          make lean
          make riscv
          make riscv-run

      - name: Decoder against sail-riscv's
        working-directory: sail-zisk
        run: make decoder-diff
