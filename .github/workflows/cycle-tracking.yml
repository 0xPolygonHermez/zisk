name: "Cycle Tracking"

on:
  pull_request:
    branches:
      - develop
      - main
      - "pre-develop-[0-9]+.[0-9]+.[0-9]*"
    paths-ignore:
      - 'book/**'
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base branch to compare against (manual runs only)"
        required: false
        default: "develop"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cycle-tracking:
    name: "Compare emulator cost vs base branch"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: "Free disk space"
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: "Checkout sources"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      # Pin the base commit now. For pull requests, the PR side is refs/pull/<n>/merge, the PR
      # merged into the base branch as it was when the event fired, and its first parent is that
      # exact base commit. Checking out the base branch by name later in the job would instead
      # get whatever it points to then, so commits merged into it while the PR side is being
      # benchmarked would show up as differences caused by the PR.
      - name: "Resolve base commit"
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref=$(git rev-parse HEAD^1)
          else
            base_ref="$INPUT_BASE_REF"
          fi
          echo "Base commit: $base_ref"
          echo "ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: "Install dependencies"
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          sudo ./install_deps.sh

      - name: "Benchmark PR branch"
        run: bash .github/scripts/zisk_bench.sh "$RUNNER_TEMP/pr"

      - name: "Checkout base branch"
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.ref }}
          path: base-tree

      - name: "Benchmark base branch"
        env:
          BENCH_REPO_DIR: ${{ github.workspace }}/base-tree
        run: bash .github/scripts/zisk_bench.sh "$RUNNER_TEMP/base"

      - name: "Build execution report"
        run: |
          python3 .github/scripts/zisk_cycle_diff.py "$RUNNER_TEMP/base" "$RUNNER_TEMP/pr" > "$RUNNER_TEMP/report.md"
          # Always show the report in this run's summary.
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload report artifact"
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cycle-tracking-report
          path: ${{ runner.temp }}/report.md
          if-no-files-found: error
          retention-days: 7