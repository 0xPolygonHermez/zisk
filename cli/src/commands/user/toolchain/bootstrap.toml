change-id = "ignore"

[build]
extended = true
tools = ["cargo", "cargo-clippy", "clippy", "rustfmt"]
cargo-native-static = true

[llvm]
download-ci-llvm = false

[rust]
channel = "auto-detect"
lld = true
llvm-tools = true

[target.riscv64ima-zisk-zkvm-elf]
cc = "riscv64-unknown-elf-gcc"
ar = "riscv64-unknown-elf-ar"
