[package]
name = "zisk-verifier"
description = "Proof verifier for the ZisK zkVM proofs"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
categories = { workspace = true }

[dependencies]
# Declared directly (not via `workspace = true`) so this crate alone can disable
# proofman-verifier's default features. NOTE: keep these in sync with the root
# Cargo.toml blocks. proofman-fields is direct because the generated verifiers
# name its types and proofman-verifier does not re-export them.
# Proofman git
proofman-verifier = { git = "https://github.com/0xPolygonHermez/pil2-proofman.git", branch = "pre-develop-1.3.0-alpha", default-features = false, features = ["verify"] }
proofman-fields = { git = "https://github.com/0xPolygonHermez/pil2-proofman.git", branch = "pre-develop-1.3.0-alpha", default-features = false, features = ["verify"] }

# Proofman crates.io
# proofman-verifier = { version = "1.3.0-alpha", default-features = false, features = ["verify"] }
# proofman-fields = { version = "1.3.0-alpha", default-features = false, features = ["verify"] }

# Proofman local development
# proofman-verifier = { path = "../../pil2-proofman/verifier", version = "1.3.0-alpha", default-features = false, features = ["verify"] }
# proofman-fields = { path = "../../pil2-proofman/fields", version = "1.3.0-alpha", default-features = false, features = ["verify"] }

[features]
default = []
std = ["proofman-verifier/std"]
