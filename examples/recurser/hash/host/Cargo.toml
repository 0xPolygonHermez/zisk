[package]
name = "recurser-hash-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "recurser-hash-host"
path = "src/main.rs"

# Dumps the leaf inputs to files for the README's CLI walkthrough.
[[bin]]
name = "gen-inputs-hash"
path = "src/bin/gen_inputs.rs"

[dependencies]
recurser-hash-common = { path = "../common" }
zisk-sdk = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Timing macros (expand to `tracing::info!`), matching the prover's log style.
proofman-util = { workspace = true }
tracing = "0.1"

[build-dependencies]
zisk-sdk = { workspace = true }

[features]
default = []
gpu = []
