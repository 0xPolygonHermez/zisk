[package]
name = "patch-substrate-bn"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: every guest pins its own patch revision, so two
# versions of the same patched crate can be tested side by side.
[workspace]

[dependencies]
ziskos = { path = "../../ziskos/entrypoint" }
patch-test-common = { path = "../common" }
substrate-bn = "=0.6.0"

[patch.crates-io]
substrate-bn = { git = "https://github.com/0xPolygonHermez/zisk-patch-bn", package = "substrate-bn", tag = "patch-0.6.0-zisk-1.4.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
