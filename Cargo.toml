# External dependencies
arc-swap = "1"
rayon = "1.10"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
colored = "3"
ark-ff = "0.5.0"
ark-std = "0.5.0"
ark-secp256k1 = "0.5"
ark-secp256r1 = "0.5"
ark-bn254 = "0.5.0"
ark-bls12-381 = "0.5.0"
sysinfo = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
anyhow = "1.0"
named-sem = "0.2.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "fmt",
  "env-filter",
  "json",
] }
tracing-appender = "0.2"
static_assertions = "1"
ripemd = "0.1.3"

clap = { version = "4", features = ["derive", "env"] }
futures = { version = "0.3" }
thiserror = { version = "2" }
bincode = { version = "2.0", default-features = false, features = [
  "serde",
  "std",
] }
tera = "1"
blake3 = "1.3.1"
bytes = "1"
hex = "0.4"
rand = "0.8.5"

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures-util = "0.3"
uuid = { version = "1", features = ["serde", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = { version = "0.10.9", features = ["compress"] }
paste = "1.0"

# gRPC dependencies
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
# Protocol Buffers support - match tonic's prost version
prost = "0.14"
prost-types = "0.14"
config = "0.15"
serial_test = "3.4"
borsh = { version = "1.5", features = ["derive"] }
reqwest = { version = "0.12", features = [
  "stream",
  "json",
  "rustls-tls",
], default-features = false }
vergen-git2 = { version = "9", default-features = false, features = ["build"] }
env = "1.0.1"
# Pin: time 0.3.48 triggers a rustc E0119 coherence false-positive when built
# alongside rcgen 0.14.x. 0.3.47 is the newest version that satisfies
# vergen-git2's `time ^0.3.45` and avoids the bug. Consumed by cli (workspace=true).
time = "=0.3.47"

alloy-sol-types = "1.5.7"
async-stream = "0.3"
cfg-if = "1.0"
getrandom = { version = "0.2", features = ["custom"] }
lazy_static = "1.5.0"
libc = "0.2"
metrics = "0.24"
path-clean = "1.0"
regex = "1.11.1"
rustfmt-wrapper = "0.2.1"
rustls = { version = "0.23", features = ["ring"] }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
signal-hook = "0.4"
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
criterion = { version = "0.8", features = ["html_reports"] }
