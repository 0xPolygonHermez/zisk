[package]
name = "zisklib"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Rust bindings for the ZisK assembly library (ziskasm/zisklib): zkvmcall thunks to the hand-written .zisk routines, plus ergonomic wrappers."
# Guest-side glue only: consumed by examples and test guests via path dependency,
# never as a versioned crates.io crate. Not published (keeps it out of the
# workspace crates.io publish list; see tools/crates.io/publish_common.sh).
publish = false

# Only the riscv64 thunks name the zkvmcall ids; the host stubs do not.
[target.'cfg(target_arch = "riscv64")'.dependencies]
zisk-definitions = { workspace = true }
